<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Civic Issue Chatbot</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #e6f2ff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0;
    }
    #chat-container {
      width: 400px;
      height: 600px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    #header {
      background: #0078ff;
      color: white;
      text-align: center;
      padding: 12px;
      font-size: 18px;
    }
    #messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #f9f9f9;
    }
    .msg {
      display: flex;
      margin: 8px 0;
    }
    .user { justify-content: flex-end; }
    .bot { justify-content: flex-start; }
    .bubble {
      max-width: 70%;
      padding: 10px;
      border-radius: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .user .bubble {
      background: #0078ff;
      color: white;
      border-bottom-right-radius: 0;
    }
    .bot .bubble {
      background: #e6e6e6;
      color: black;
      border-bottom-left-radius: 0;
    }
    #input-area {
  display: flex;
  align-items: center;   /* ✅ keeps plus, input, and send button aligned vertically */
  border-top: 1px solid #ddd;
  padding: 5px;
  background: #fff;
}

#plus-btn {
  background: #0078ff;
  color: white;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 22px;
  display: flex;
  justify-content: center;  /* ✅ centers plus horizontally */
  align-items: center;      /* ✅ centers plus vertically */
  margin-right: 8px;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

    #userInput {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      font-size: 14px;
    }
    #input-area button {
      background: #0078ff;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 8px;
    }

    /* Plus button inside input bar */
    #plus-btn {
      background: #0078ff;
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 20px;
      margin-right: 5px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* Hidden menu */
    #menu {
      position: absolute;
      bottom: 55px;
      left: 10px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      padding: 5px;
      z-index: 10;
    }
    #menu button {
      background: none;
      border: none;
      padding: 10px;
      text-align: left;
      cursor: pointer;
      width: 150px;
    }
    #menu button:hover {
      background: #f0f0f0;
    }
    #fileInput {
      display: none;
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="header">🤖 CivixBot</div>
    <div id="messages"></div>

    <!-- Hidden Menu -->
    <div id="menu">
      <button onclick="document.getElementById('fileInput').click()">📷 Upload Image</button>
      <input type="file" id="fileInput" onchange="uploadImage()">
    </div>

    <div id="input-area">
      <!-- Plus button inside chat input bar -->
      <button id="plus-btn" onclick="toggleMenu()">+</button>
      <input id="userInput" type="text" placeholder="Type your message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000";

    function addMessage(text, sender="bot") {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = text;
      div.appendChild(bubble);
      document.getElementById("messages").appendChild(div);
      document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const msg = input.value.trim();
      if (!msg) return;
      addMessage(msg, "user");
      input.value = "";

      addMessage("⏳ typing...", "bot");
      const res = await fetch(API_URL + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();

      document.querySelectorAll(".bot .bubble").forEach(el => {
        if (el.innerText === "⏳ typing...") el.parentNode.remove();
      });

      addMessage(data.reply, "bot");
    }

    async function uploadImage() {
      const file = document.getElementById("fileInput").files[0];
      if (!file) return;

      addMessage("📤 Uploading image...", "user");

      const formData = new FormData();
      formData.append("image", file);

      const res = await fetch(API_URL + "/analyze", {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      addMessage(`📷 Detected issue: <b>${data.label}</b> (confidence: ${data.confidence.toFixed(2)})`, "bot");
    }

    function toggleMenu() {
      const menu = document.getElementById("menu");
      menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }
    // Allow sending message with Enter key
    document.getElementById("userInput").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            e.preventDefault(); // prevents newline in input
            sendMessage();
  }
});

  </script>
</body>
</html>
